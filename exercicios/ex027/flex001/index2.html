<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .container {
            background-color: lightblue;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;

            height: 200px;
        
        }

        .item {
            background-color: antiquewhite;
            border: 1px solid black;
            padding: 20px;

            flex-basis: 200px;
        }

        .item#item1 {
            flex: 2 1 200px;
            
        }

        .item#item2 {

            flex: 0 0 200px;
        }

        
        .item#item3 {
        
            flex: 1 2 200px
        }
    </style>
<body>
    <div class="container">
        <div class="item" id="item1">A</div>
        <div class="item" id="item2">B</div>
        <div class="item" id="item3">C</div>
        <div class="item" id="item4">D</div>
        <div class="item" id="item5">E</div>
    </div>
  
</body>
</html>
