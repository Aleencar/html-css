<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: lightblue;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;

            height: 300px;
            
        }

        .item {
            background-color: aquamarine;
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }

         .container2 {
            background-color: lightcoral;

            display: flex;
            flex-flow: row  wrap;

            justify-content: center;
            align-content: center;
            height: 400px;
            margin-top: 20px;
        }

        .item2 {
            background-color: white;
            border: 1px solid black;
            padding: 50px;
            text-align: center;

        }
    </style>
<body>
    <div class="container">
        <div class="item" style="order: 3; align-self: stretch;">A</div>
        <div class="item">B</div>
        <div class="item" style="align-self: flex-start;">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
    </div>
    <div class="container2">
        <div class="item2">A</div>
        <div class="item2">B</div>
        <div class="item2" style="flex-basis: 200px;">C</div>
        <div class="item2">D</div>
        <div class="item2" style="flex-basis: 350px;">E</div>
    </div>
</body>
</html>
