<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: lightblue;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;

            height: 300px;
            
        }

        .item {
            background-color: aquamarine;
            text-align: center;
            border: 1px solid black;
            padding: 10px;

            flex-shrink: 0;
            flex-grow: 1;
        }

         .container2 {
            background-color: lightcoral;

            display: flex;
            flex-flow: row  wrap;
            align-content: center;
        
            height: 400px;
            margin-top: 20px;
        }

        .item2 {

            background-color: white;
            border: 1px solid black;
            padding: 50px;
            text-align: center;

            
        }

        .item#item1 {
        
            flex-shrink: 1;
            flex-grow: 2;
        }

        
    </style>
<body>
    <div class="container">
        <div class="item" id="item1">A</div>
        <div class="item" id="item2">B</div>
        <div class="item" id="item3">C</div>
        <div class="item" id="item4">D</div>
        <div class="item" id="item5">E</div>
    </div>
    <div class="container2">
        <div class="item2" id="item1">A</div>
        <div class="item2" id="item2">B</div>
        <div class="item2" id="item3">C</div>
        <div class="item2" id="item4">D</div>
        <div class="item2" id="item5">E</div>
    </div>
</body>
</html>
