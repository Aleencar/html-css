<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1> Meu Primeiro Formulário </h1>   
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="inome">Nome completo:</label>
            <input type="text" name="nome" id="inome" required autocomplete="name"></p>
       
            <label for="iusu">Usuário:</label>
            <input type="text" name="usu" id="iusu" required minlength="5" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" autocomplete="new-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
